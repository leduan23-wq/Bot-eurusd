name: Run Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x' # Cambia según la versión de Python que utilices

      - name: Run script
        run: |
          python bot.py # Ajusta el comando según cómo ejecutes tu bot
